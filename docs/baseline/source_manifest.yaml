# --- The user's original goal (verbatim intent, not paraphrased product copy) ---
original_goal: >
  Build an automated bioinformatics system whose core closed loop turns a
  natural-language research question into a structured research spec, executable
  analysis tasks, QC-audited computational evidence, claims bounded by an evidence
  ceiling, and a deliverable reproduction bundle. Success is defined not by "the AI
  produced an answer" but by traceability, recorded choices, no over-claiming, third
  party reproducibility, and the ability to stop conservatively (INSUFFICIENT_DATA /
  METHOD_NOT_APPLICABLE / ...) instead of fabricating a result. Source of truth for
  scope is the two requirement documents below; the broader "research intelligence
  platform" blueprint is explicitly out of scope for this build.

