[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-bioinfo"
version = "0.1.0"
description = "Automated bioinformatics closed-loop core (lightweight, offline, auditable, reproducible)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Runtime dependency group (WP-01a / T-01-02): the only thing the production
# closed-loop needs at run time is numpy. Heavier infrastructure (DB, object
# store, workflow engine, LLM) stays behind reserved ports and is NOT a runtime
# dependency at this stage.
dependencies = [
    "numpy>=1.24",
]

# Additive dependency groups (WP-01a / T-01-02). Runtime = [project.dependencies]
# above; `test` = test runners only; `dev` = `test` plus lint/type tooling.
# `dev` references `test` so `pip install .[dev]` keeps installing the test deps
# (the held ci/ci.yml workflow installs `.[dev]`).
[project.optional-dependencies]
test = [
    "pytest>=7",
]
dev = [
    "auto-bioinfo[test]",
    "ruff>=0.4",
    "mypy>=1.8",
    "coverage[toml]>=7",
]

[project.scripts]
bioauto = "auto_bioinfo.interfaces.cli:main"

[tool.setuptools.packages.find]
include = ["auto_bioinfo*"]

[tool.setuptools.package-data]
"auto_bioinfo.fixtures" = ["**/*.tsv", "**/*.json"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

# Type checking (WP-01c / T-01-07). Advisory, non-blocking at this stage to
# match the held CI step; `make typecheck` runs mypy with --ignore-missing-imports.
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

# Coverage (WP-01c / T-01-07). The canonical test runner is `unittest`; coverage
# wraps it (see `make coverage`). Scope is the package only; tests/fixtures and
# reserved-port stubs are excluded so the number reflects exercised product code.
[tool.coverage.run]
branch = true
source = ["auto_bioinfo"]
omit = ["auto_bioinfo/fixtures/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
